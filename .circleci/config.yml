# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/2.0/configuration-reference
version: 2.1

orbs:
  node: circleci/node@5.1.0
  gh: circleci/github-cli@2.1.0

jobs:
  build-and-test-uat:
    machine:
      image: ubuntu-2204:2023.04.2
    resource_class: large
    environment:
      # The suite builds its gateway URL as
      # `http://localhost:3002/${process.env.NETWORK}/rpc`, with no fallback in
      # the steps that store and read content. Unset, that addresses
      # `/undefined/rpc` and the calls never reach the gateway at all. This is
      # the same network hooks.step.ts falls back to when initialising wallets.
      NETWORK: arianeetestnet
    steps:
      - checkout
      - run:
          name: Fix up git URLs
          command: echo -e '[url "https://github.com/"]\n  insteadOf = "git://github.com/"' >> ~/.gitconfig
      - run:
          name: Declare domain blockchain
          command: echo 127.0.0.1 blockchain | sudo tee -a /etc/hosts
      - run:
          name: Declare domain wallet
          command: echo 127.0.0.1 wallet | sudo tee -a /etc/hosts
      - node/install:
          node-version: 18.16.0
      - node/install-packages
      # The two build contexts are private repositories fetched over SSH, so the
      # job needs their read-only deploy keys. This replaces a GitHub token that
      # was interpolated straight into the context URL.
      - add_ssh_keys:
          fingerprints:
            - "c5:22:5b:2f:6b:d4:a7:7f:b5:f8:70:1d:24:7a:b5:d3" # read-only on docker-rpc-server
            - "8d:a2:8f:78:a0:24:b3:19:be:d3:ba:b2:ea:33:a2:80" # read-only on arianee-faucet
      - run:
          name: Trust github.com host key
          command: ssh-keyscan -H github.com >> ~/.ssh/known_hosts
      - run:
          name: Fetch private build contexts
          command: ./scripts/fetch-build-contexts.sh
      - run:
          name: Launch docker
          command: docker-compose up --build --detach --force-recreate privacy-gateway
      # `docker-compose up --detach` returns as soon as the containers are
      # started, not when the app inside is listening. The suite used to race it
      # and die on ECONNREFUSED 127.0.0.1:3002 on its first scenario.
      - run:
          name: Wait for the privacy gateway to listen
          command: |
            for i in $(seq 1 60); do
              # Any HTTP answer means the gateway is up; the status code does
              # not matter, so plain `curl -s` is the right probe.
              if curl -s --max-time 2 -o /dev/null http://127.0.0.1:3002; then
                echo "gateway answering after ${i}s"
                exit 0
              fi
              sleep 1
            done
            echo "gateway still silent after 60s - container logs follow:"
            docker-compose logs --no-color --tail=80 privacy-gateway || true
            exit 1
      - run:
          name: Run tests
          command: npm test
      # The suite talks to the gateway over RPC; when a step hangs, the only
      # place that says why is the gateway itself. Dumped whatever happens.
      - run:
          name: Gateway and mongo logs
          when: always
          command: |
            echo '----- privacy-gateway -----'
            docker-compose logs --no-color --tail=120 privacy-gateway || true
            echo '----- mongo -----'
            docker-compose logs --no-color --tail=40 mongo || true
  build-and-test-playwright:
    docker:
      - image: mcr.microsoft.com/playwright:focal
    resource_class: large
    environment:
      NODE_ENV: development
    steps:
      - checkout
      - run:
          name: Install python
          command: |
            apt-get update -y
            apt-get install -y python3.8 python3-pip
      - node/install:
          node-version: 18.16.0
      - node/install-packages
      - run:
          name: Fix up git URLs
          command: echo -e '[url "https://github.com/"]\n  insteadOf = "git://github.com/"' >> ~/.gitconfig
      - run:
          name: Build wallet
          command: npm run build
      - run:
          name: Run tests
          command: npm run test:playwright
      - persist_to_workspace:
          root: ./
          paths:
            - "*"

  deploy-npm:
    docker:
      - image: cimg/node:18.16.0
    resource_class: large
    steps:
      - checkout
      - attach_workspace:
          at: ./
      - node/install-packages
      - run:
          name: Auth With NPM
          command: echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > .npmrc
      - run:
          name: Publish to NPM
          command: npm publish --ignore-scripts

  bump-version-github:
    docker:
      - image: cimg/node:18.16.0
    steps:
      - checkout
      - add_ssh_keys:
          fingerprints:
            - "66:05:66:0b:67:7a:59:b2:25:4b:88:f9:97:50:c4:88"
      - run:
          name: Config Github account
          command: |
            git config user.name "Package Version Bot"
            git config user.email "tech@arianee.org"
      - run:
          name: Change version in package.json
          command: npm run bump:minor

  push-gh-release:
      docker:
          - image: cimg/node:18.16.0
      steps:
          - checkout
          - gh/setup:
              version: 2.14.3
              token: GITHUBTOKEN
          - run:
              command: 'gh release create v$(grep ''"version": "'' package.json | cut -d ''"'' -f4) --generate-notes'
              name: Create Github Release

workflows:
  sample:
    jobs:
      - build-and-test-uat
      - build-and-test-playwright
      - deploy-approval:
          type: approval
          requires:
            - build-and-test-uat
            - build-and-test-playwright
          filters:
            branches:
              only:
                - master
      - deploy-npm:
          requires:
            - deploy-approval
      - push-gh-release:
          requires:
            - deploy-npm
      - bump-version-github:
          requires:
            - deploy-npm
